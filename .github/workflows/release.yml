name: Release

# A pushed tag v<version> builds the mod for every 26.x target at that version, runs the unit and
# server game tests, and publishes the jars as a GitHub release. Running it by hand builds and
# tests the same way and keeps the jars as an artifact of the run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION_ARG=-Pmod.version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build and test
        run: >
          ./gradlew --no-daemon $VERSION_ARG
          :26.1.2:assemble :26.2:assemble :26.3:assemble
          :26.2:checkstyleMain :26.2:test :26.2:runGameTest

      # The tests run for the active Stonecutter version only, so 26.3's run after switching to it.
      # The switch rewrites the sources in place, which is why it comes after every other step that
      # reads them.
      - name: Test 26.3
        run: |
          ./gradlew --no-daemon "Set active project to 26.3"
          ./gradlew --no-daemon $VERSION_ARG :26.3:test :26.3:runGameTest

      # Both archives are the same for every Minecraft version. The --version flag only copies the
      # file into a run directory, so one copy of each goes on the release.
      - name: Build the example add-ons
        run: |
          python3 tools/showcase/build.py --out dist/bedbug-showcase.mcaddon
          python3 tools/testpack/build.py --out dist/bedbug-test-addon.mcaddon

      - uses: actions/upload-artifact@v4
        with:
          name: mcaddon-jars
          path: |
            versions/26.*/build/libs/*.jar
            dist/*.mcaddon

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            versions/26.*/build/libs/*.jar
            dist/bedbug-showcase.mcaddon
            dist/bedbug-test-addon.mcaddon
          body: |
            ## Add-ons to try

            - `bedbug-showcase.mcaddon` is the Bedbug Showcase. It holds two mobs, two blocks, four
              items, a biome, a camera preset and a form, and it is the add-on the store pictures show.
            - `bedbug-test-addon.mcaddon` is the add-on the mod's own tests run against. It has one of
              nearly everything Bedbug reads, so it is a quick way to check an install.

            Put either file in `addons/`. Both work on every Minecraft version listed in the README.
          generate_release_notes: true

      # Reruns skip a version Modrinth already has. The token is the repository secret MODRINTH_TOKEN.
      - name: Publish to Modrinth
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 tools/release/modrinth.py --version "${GITHUB_REF_NAME#v}" versions/26.*/build/libs/*.jar
